<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'">
  <title>MIRA 3D 基本版（フォルダ読込）</title>
  <link rel="stylesheet" href="folder_reader/loader.css">
  <script defer src="folder_reader/palette.js"></script>
  <script defer src="folder_reader/parser.js"></script>
  <script defer src="folder_reader/loader.js"></script>
</head>
<body>
  <header><h1>MIRA 3D <span>基本版（フォルダ読込）</span></h1><a href="archive/index.html" target="_blank" rel="noopener">旧版アーカイブ</a></header>
  <main>
    <form id="loadForm">
      <button id="chooseFolder" type="button">フォルダを選ぶ</button>
      <input id="folder" type="file" webkitdirectory multiple hidden>
      <label>系列<select id="series" disabled><option>フォルダを選んでください</option></select></label>
      <label>開始番号<input id="first" type="number" step="1" required disabled></label>
      <label>終了番号<input id="last" type="number" step="1" required disabled></label>
      <label>測点間隔（mm）<input id="stepMm" type="number" min="0.1" step="any" value="100" required></label>
      <button id="load" type="submit" disabled>読み込んで表示</button>
    </form>
    <p id="status" role="status" aria-live="polite">測定ファイルのあるフォルダを選んでください。</p>
    <p class="note">番号差 × 測点間隔で配置します。欠番は空白にし、補間でもつなぎません。開始番号の位置を0 mmとして表示します。</p>
    <p class="note">ファイルはPC内で処理します。外部送信・元ファイルの変更は行いません。</p>
    <div id="viewerHost"><p class="empty">系列と番号範囲を指定すると、読み込んだ測定データを3D表示できます。</p></div>
  </main>
</body>
</html>
